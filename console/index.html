<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070b">
<title>AXA Console</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/addon-search.js"></script>
<script src="/vendor/addon-web-links.js"></script>
<script src="/vendor/addon-webgl.js"></script>
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<header>
  <div class="brand"><h1>AXA</h1><span>orchestration console</span></div>
  <span id="live">offline</span>
  <div class="stat"><small>sessions</small><b id="s-agents">0</b></div>
  <div class="stat"><small>working</small><b id="s-running">0</b></div>
  <div class="stat"><small>done</small><b id="s-calls">0</b></div>
  <button id="needs" title="A session is waiting for your approval: open it">⚠ <span id="needsn">0</span> needs you</button>
  <span class="spacer"></span>
  <button id="tbtn" title="Show terminals">Terminals</button>
  <button id="ibtn" class="on" title="Show the intel panel">Intel</button>
  <button id="viewbtn" title="Show every tool call on the map">Detail</button>
  <button id="demo" title="Play a simulated orchestration">Demo</button>
  <button id="fit" title="Fit the view · double-click: put moved cards back">Center</button>
  <select id="session" title="session"></select>
</header>
<div id="limitnote" role="status" hidden></div>
<section id="terms">
  <div class="tabs"><button id="newterm" title="New terminal">+</button><div id="tablist" style="display:flex"></div><span class="grow"></span><button class="tb" id="fontdown" title="Smaller text">A−</button><button class="tb" id="fontup" title="Larger text">A+</button><button class="tb" id="findbtn" title="Search the terminal (Ctrl+Shift+F)">⌕</button><button id="layoutbtn" title="Move terminal">⬓</button></div>
  <div id="termhost"><div id="termmsg">No terminals<br><br>Press + to launch Claude Code in a project</div></div>
  <div id="keybar" aria-label="Keys a phone keyboard lacks">
    <button data-k="esc" title="Esc: stop or go back">Esc</button><button data-k="ctrl" title="Ctrl: hold for the next key">Ctrl</button><button data-k="c" title="Ctrl-C">^C</button>
    <button data-k="tab">Tab</button><button data-k="stab" title="Shift-Tab: Claude's mode switch">⇧Tab</button>
    <button data-k="up" title="Up">↑</button><button data-k="down" title="Down">↓</button><button data-k="left" title="Left">←</button><button data-k="right" title="Right">→</button>
    <button data-k="enter" title="Enter">⏎</button><button data-k="kbd" title="Show the keyboard">⌨</button>
  </div>
  <div id="findbar" hidden><input id="findq" placeholder="Search this terminal" aria-label="Search this terminal"><span id="findn"></span><button id="findprev" title="Previous (Shift+Enter)">↑</button><button id="findnext" title="Next (Enter)">↓</button><button id="findx" title="Close (Esc)">✕</button></div>
  <div id="picker" hidden></div>
  <div id="splitter"></div>
</section>
<main id="stage">
  <canvas id="cv"></canvas>
  <div id="planets"></div>
  <div id="now"><span class="k">Now</span><span class="txt" id="nowtxt">Ready</span>
    <span class="legend"><i class="lw">●</i> working <i class="ld">✓</i> done <i class="ln">⚠</i> needs you <i class="ls">⏳</i> stuck <i class="lt">◆</i> your turn</span>
    <button id="bell" title="Desktop notification when something needs you or AXA finishes">🔔</button></div>
  <div id="dock"><div class="mission"><span>Mission</span><span class="bar"><i id="mbar"></i></span><span id="mtext"></span></div><div id="cards"></div></div>
  <div id="empty">Standing by<br><br>Start a Claude Code session with AXA enabled — or run the demo</div>
</main>
<aside>
  <section id="inbox"><p class="title"><span>Sessions</span><span id="inboxsum"></span></p><div id="sesslist"></div></section>
  <section id="detail"></section>
  <section id="feedwrap"><p class="title">Activity</p><div id="feed"></div></section>
</aside>
<div id="diffview" hidden><div id="diffbox" role="dialog" aria-modal="true" aria-labelledby="diffname">
  <div id="diffhead"><b id="diffname"></b><span class="meta" id="diffmeta"></span><button id="diffterm">Open terminal</button><button id="diffclose" title="Close (Esc)">✕</button></div>
  <pre id="diffbody"></pre>
</div></div>
<nav id="mnav" aria-label="Sections">
  <button data-go="inbox" class="on"><i>☰</i>Sessions<span class="badge" id="mbadge"></span></button>
  <button data-go="terms"><i>›_</i>Terminal</button>
  <button data-go="stage"><i>◎</i>Map</button>
  <button data-go="feedwrap"><i>≡</i>Activity</button>
</nav>

<script src="/ui/state.js"></script>
<script src="/ui/map.js"></script>
<script src="/ui/panel.js"></script>
<script src="/ui/sessions.js"></script>
<script src="/ui/diff.js"></script>
<script src="/ui/nav.js"></script>
<script src="/ui/demo.js"></script>
<script src="/ui/terminals.js"></script>
<script src="/ui/main.js"></script>
</body>
</html>
