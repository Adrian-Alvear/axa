<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070b">
<title>AXA Console</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<style>
  :root {
    --bg: #04070b; --panel: rgba(10, 20, 28, .72); --line: rgba(79, 216, 255, .14); --line2: rgba(79, 216, 255, .28);
    --text: #cfe9f3; --dim: #6c8a99; --accent: #4fd8ff; --amber: #ffb547; --red: #ff5468;
    /* session status: each one also has its own glyph and word, never color alone */
    --st-work: #4fd8ff; --st-done: #5ef2c2; --st-wait: #ffb547; --st-stuck: #ff8a5c; --st-idle: #8fb3c4; --st-off: #6c8a99;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  body { --aw: 360px; display: grid; grid-template-columns: 0 minmax(0, 1fr) var(--aw); grid-template-rows: auto minmax(0, 1fr) 0; height: 100vh; height: 100dvh; overflow: hidden; }
  body.with-terms { grid-template-columns: var(--tw, 46vw) minmax(0, 1fr) var(--aw); }
  /* bottom layout: map + intel on top, terminal full width underneath */
  body.term-bottom { grid-template-columns: minmax(0, 1fr) var(--aw); }
  body.term-bottom.with-terms { grid-template-columns: minmax(0, 1fr) var(--aw); grid-template-rows: auto minmax(0, 1fr) var(--th, 42vh); }
  body.term-bottom #terms { grid-column: 1 / -1; grid-row: 3; border-right: 0; border-top: 1px solid var(--line2); }
  body.term-bottom #stage { grid-column: 1; }
  body.term-bottom aside { grid-column: 2; }
  body.term-bottom #splitter { top: -4px; left: 0; right: 0; bottom: auto; width: auto; height: 8px; cursor: row-resize; }
  body.term-bottom #splitter:hover, body.term-bottom #splitter.drag { background: linear-gradient(to bottom, transparent 3px, var(--accent) 3px, var(--accent) 4px, transparent 4px); }
  .tabs .grow { flex: 1; }
  #layoutbtn { border: 0; border-left: 1px solid var(--line); border-radius: 0; padding: 0 12px; font-size: 13px; letter-spacing: 0; }
  #termmsg .list { width: min(460px, 100%); text-align: left; text-transform: none; letter-spacing: normal; font-size: 12px; margin-top: 18px; }
  body.no-intel { --aw: 0px; } body.no-intel aside { display: none; }
  button.on { border-color: var(--accent); color: var(--accent); }

  #terms { grid-column: 1; grid-row: 2; display: none; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; border-right: 1px solid var(--line); position: relative; background: #03060a; }
  body.with-terms #terms { display: grid; }
  #main-stage { grid-column: 2; }
  .tabs { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); min-height: 34px; overflow-x: auto; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; border-right: 1px solid var(--line); color: var(--dim); cursor: pointer; white-space: nowrap; font-size: 11px; letter-spacing: .08em; border-bottom: 2px solid transparent; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); background: rgba(79,216,255,.05); }
  .tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .tab.dead .dot { background: var(--dim); box-shadow: none; }
  .tab.waiting .dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: blink 1s infinite; }
  .tab .mode { color: var(--dim); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; }
  .tab.axa { color: var(--accent); letter-spacing: .2em; }
  .tab.axa .dot { border-radius: 1px; transform: rotate(45deg); }
  .axa-row { border: 1px solid var(--line2) !important; padding: 8px 8px !important; background: rgba(79,216,255,.05); }
  .axa-row b { color: var(--accent) !important; letter-spacing: .15em; }
  .tab .x { color: var(--dim); padding: 2px 4px; } .tab .x:hover { color: var(--red); }
  #newterm { border: 0; border-right: 1px solid var(--line); border-radius: 0; padding: 0 14px; font-size: 14px; letter-spacing: 0; }
  #termhost { position: relative; min-height: 0; }
  #termhost .xt { position: absolute; inset: 8px 4px 4px 10px; display: none; }
  #termhost .xt.active { display: block; }
  #termmsg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--dim); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; padding: 24px; overflow: auto; }
  #picker { position: absolute; top: 36px; left: 8px; z-index: 5; width: min(420px, calc(100% - 16px)); max-height: 70%; overflow: auto; background: #07111a; border: 1px solid var(--line2); box-shadow: 0 12px 40px rgba(0,0,0,.6); padding: 10px; }
  #picker[hidden] { display: none; }
  #picker .proj, #termmsg .proj { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  #picker .proj div b, #termmsg .proj div b { display: block; font-weight: 500; color: var(--text); }
  #picker .proj div small, #termmsg .proj div small { color: var(--dim); font-size: 10px; }
  #picker input, #termmsg input { width: 100%; background: transparent; border: 1px solid var(--line2); color: var(--text); font: inherit; padding: 6px 8px; margin-top: 8px; }
  #splitter { position: absolute; top: 0; right: -4px; bottom: 0; width: 8px; cursor: col-resize; z-index: 4; }
  #splitter:hover, #splitter.drag { background: linear-gradient(to right, transparent 3px, var(--accent) 3px, var(--accent) 4px, transparent 4px); }

  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 22px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: .6em; color: var(--accent); text-shadow: 0 0 12px rgba(79,216,255,.5); }
  .brand span { color: var(--dim); letter-spacing: .25em; font-size: 10px; text-transform: uppercase; }
  #live { color: var(--dim); font-size: 10px; letter-spacing: .25em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  #live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
  #live.on { color: var(--accent); } #live.on::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .stat { display: flex; flex-direction: column; line-height: 1.2; }
  .stat small { color: var(--dim); font-size: 9px; letter-spacing: .25em; text-transform: uppercase; }
  .stat b { color: var(--text); font-weight: 400; font-size: 16px; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  button, select { background: transparent; color: var(--text); border: 1px solid var(--line2); border-radius: 2px; padding: 5px 12px; font: inherit; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); color: var(--accent); }
  select { max-width: 300px; letter-spacing: .05em; text-transform: none; font-size: 11px; }
  select option { background: #0a141c; }

  #stage { grid-column: 2; grid-row: 2; position: relative; overflow: hidden; min-height: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #cv.drag { cursor: grabbing; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); text-align: center; pointer-events: none; padding: 16px; letter-spacing: .2em; font-size: 10px; text-transform: uppercase; }

  #dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 14px; background: linear-gradient(to top, rgba(4,7,11,.96) 70%, rgba(4,7,11,0)); display: none; }
  #dock.on { display: block; }
  .mission { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 9px; letter-spacing: .25em; text-transform: uppercase; color: var(--dim); }
  .mission .bar { flex: 1; height: 2px; background: var(--line); position: relative; overflow: hidden; }
  .mission .bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); box-shadow: 0 0 8px var(--accent); transition: width .6s ease; }
  .mission b { color: var(--text); font-weight: 400; }
  #cards { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
  .card { flex: 0 0 236px; border: 1px solid var(--line); border-top: 2px solid var(--c); background: var(--panel); padding: 8px 10px 9px; cursor: pointer; transition: opacity .8s, border-color .3s; backdrop-filter: blur(4px); }
  .card:hover { border-color: var(--line2); border-top-color: var(--c); }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card .role { color: var(--c); font-size: 10px; letter-spacing: .25em; text-transform: uppercase; }
  .card .time { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 10px; }
  .card .task { color: #e3f6fc; margin: 3px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .bar { height: 2px; background: var(--line); position: relative; overflow: hidden; margin-bottom: 6px; }
  .card .bar i { position: absolute; top: 0; bottom: 0; width: 35%; background: var(--c); box-shadow: 0 0 6px var(--c); animation: scan 1.4s ease-in-out infinite; }
  @keyframes scan { from { left: -35%; } to { left: 100%; } }
  .card.done .bar i { animation: none; left: 0; width: 100%; opacity: .5; }
  .card.perm .bar i { background: var(--amber); box-shadow: 0 0 6px var(--amber); animation-duration: .7s; }
  .card .now { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; color: var(--dim); }
  .card .now span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .now b { color: var(--text); font-weight: 400; }
  .card .st { white-space: nowrap; letter-spacing: .15em; text-transform: uppercase; font-size: 9px; }
  .card.perm .st { color: var(--amber); } .card.fail .st { color: var(--red); } .card.done .st { color: var(--c); }
  .card.fading { opacity: .35; }

  aside { grid-column: 3; grid-row: 2; border-left: 1px solid var(--line); display: grid; grid-template-rows: auto auto 1fr; min-height: 0; }

  /* ---------- sessions list: what needs you first, then what's working, done, idle ---------- */
  #inbox { border-bottom: 1px solid var(--line); padding: 14px 18px 12px; max-height: 40vh; overflow: auto; }
  /* room for a prompt's options: the selected-node detail steps aside while something waits on you */
  #inbox:has(.sess[data-state=waiting]) { max-height: 64vh; }
  aside:has(.sess[data-state=waiting]) #detail { display: none; }
  #inbox .title { display: flex; justify-content: space-between; gap: 8px; }
  #inboxsum { letter-spacing: .12em; text-transform: none; }
  #inboxsum .w { color: var(--st-wait); }
  .sess { --c: var(--st-idle); border: 1px solid var(--line); border-left: 3px solid var(--c); background: var(--panel); padding: 7px 10px 8px; margin-bottom: 6px; cursor: pointer; }
  .sess:hover { border-color: var(--line2); border-left-color: var(--c); }
  .sess[data-state=working] { --c: var(--st-work); } .sess[data-state=done] { --c: var(--st-done); }
  .sess[data-state=waiting] { --c: var(--st-wait); background: color-mix(in srgb, var(--st-wait) 9%, var(--bg)); }
  .sess[data-state=stuck] { --c: var(--st-stuck); background: color-mix(in srgb, var(--st-stuck) 8%, var(--bg)); }
  .sess[data-state=exited] { --c: var(--st-off); opacity: .7; }
  .sess .sh { display: flex; align-items: baseline; gap: 8px; }
  .sess .chip { color: var(--c); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .sess[data-state=working] .chip::first-letter { animation: blink 1.2s infinite; }
  .sess .nm { color: #e9fbff; font-weight: 500; letter-spacing: .08em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .ago { color: var(--dim); font-size: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sess .sd { margin-top: 3px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .sess .sg { color: var(--dim); font-size: 11px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .sg .add { color: var(--st-done); } .sess .sg .del { color: var(--red); }
  .sess .sg .over { color: var(--st-wait); }
  /* the prompt's last lines (the actual question) matter most: anchor it to the bottom */
  .sess .sq { margin-top: 6px; color: var(--text); white-space: pre-wrap; font-size: 11px; line-height: 1.4; max-height: 5.6em; overflow: hidden; border-left: 2px solid var(--c); padding-left: 8px; display: flex; flex-direction: column; justify-content: flex-end; }
  .sess .sq:empty, .sess .sc:empty { display: none; }
  .sess .sc { display: flex; flex-direction: column; gap: 5px; margin-top: 7px; }
  .sess .sc button { text-align: left; text-transform: none; letter-spacing: .02em; font-size: 12px; padding: 6px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .sc button.armed { border-color: var(--c); color: #1a1000; background: var(--c); font-weight: 600; }
  .sess .sa { display: flex; gap: 6px; margin-top: 6px; }
  .sess .sa button { padding: 3px 10px; }
  .sess .sa button.hot { border-color: var(--c); color: var(--c); }
  #sesslist .none { color: var(--dim); padding: 4px 0 2px; }
  .planet .pg { color: var(--dim); font-size: 10px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .planet .pg .over { color: var(--st-wait); }
  .planet .pg .add, #diffhead .add { color: var(--st-done); } .planet .pg .del, #diffhead .del { color: var(--red); }

  /* ---------- changes viewer (a session's uncommitted diff) ---------- */
  #diffview { position: fixed; inset: 0; z-index: 20; background: rgba(2,5,8,.78); display: grid; place-items: center; padding: 24px; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #diffview[hidden] { display: none; }
  #diffbox { width: min(980px, 100%); height: min(86vh, 100%); display: grid; grid-template-rows: auto 1fr; background: #050c12; border: 1px solid var(--line2); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  #diffhead { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #diffhead b { color: #e9fbff; letter-spacing: .15em; text-transform: uppercase; font-weight: 500; }
  #diffhead .meta { color: var(--dim); flex: 1; min-width: 0; }
  #diffbody { margin: 0; overflow: auto; padding: 10px 14px 16px; font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre; tab-size: 4; }
  #diffbody .a { color: #8ff7d6; background: rgba(94,242,194,.07); display: inline-block; min-width: 100%; }
  #diffbody .d { color: #ff8a98; background: rgba(255,84,104,.07); display: inline-block; min-width: 100%; }
  #diffbody .h { color: var(--accent); } #diffbody .f { color: #e9fbff; font-weight: 600; } #diffbody .n { color: var(--dim); }

  /* phone navigation: hidden on wide screens */
  #mnav { display: none; }
  .title { color: var(--dim); font-size: 9px; letter-spacing: .3em; text-transform: uppercase; margin: 0 0 8px; }
  #detail { border-bottom: 1px solid var(--line); padding: 16px 18px; max-height: 50vh; overflow: auto; }
  #detail:empty { display: none; }
  #detail h2 { margin: 0 0 10px; font-size: 13px; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; }
  #detail .kv { display: grid; grid-template-columns: 74px 1fr; gap: 2px 10px; margin-bottom: 10px; }
  #detail .k { color: var(--dim); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; }
  #detail pre { white-space: pre-wrap; word-break: break-word; background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--line2); padding: 8px 10px; margin: 4px 0 12px; max-height: 170px; overflow: auto; font: inherit; }
  #detail ul { margin: 2px 0 10px; padding-left: 0; list-style: none; }
  #detail li { padding: 2px 0; }
  #feedwrap { display: grid; grid-template-rows: auto 1fr; min-height: 0; padding-top: 14px; }
  #feedwrap .title { padding: 0 18px; }
  #feed { overflow: auto; min-height: 0; padding-bottom: 8px; }
  .row { display: grid; grid-template-columns: 62px 84px 1fr; gap: 8px; padding: 3px 18px; border-left: 2px solid transparent; animation: in .35s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateX(6px); } }
  .row:hover { background: rgba(79,216,255,.04); }
  .row .t { color: var(--dim); font-variant-numeric: tabular-nums; }
  .row .who { text-transform: uppercase; letter-spacing: .12em; font-size: 10px; padding-top: 1px; }
  .row .who, .row .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.fail { border-left-color: var(--red); } .row.fail .what { color: var(--red); }
  .row.perm { border-left-color: var(--amber); } .row.perm .what { color: var(--amber); }
  .row.call { border-left-color: var(--line2); }
  .row.prompt .what { color: #fff; }
  .row b { font-weight: 500; color: #fff; }

  /* ---------- mission view: projects as planets around AXA ---------- */
  #planets { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  body.detail #planets, body.detail #now { display: none; }
  /* the session picker only matters in the detail view (the mission view follows AXA) */
  body:not(.detail) #session { display: none; }
  .planet { position: absolute; left: 0; top: 0; width: 210px; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer;
    border: 1px solid var(--line2); border-top: 2px solid var(--c, var(--dim)); background: rgba(6,14,21,.9); padding: 9px 11px 10px; backdrop-filter: blur(4px); }
  .planet:hover { border-color: var(--c, var(--line2)); }
  .planet.dragging { cursor: grabbing; opacity: .85; z-index: 2; }
  .planet .pn { display: flex; justify-content: space-between; gap: 8px; color: #e9fbff; font-size: 11px; letter-spacing: .25em; text-transform: uppercase; }
  .planet .ps { color: var(--c, var(--dim)); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; margin-top: 3px; }
  .planet .pd { color: var(--text); margin-top: 5px; font-size: 11px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .planet .pe { color: var(--red); font-size: 10px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .planet.working { --c: #4fd8ff; } .planet.working .ps::before { content: "● "; animation: blink 1.2s infinite; }
  .planet.done { --c: #5ef2c2; } .planet.ready, .planet.starting { --c: #8fb3c4; } .planet.exited { --c: #4f6b7a; opacity: .6; }
  .planet.stuck { --c: #ff8a5c; box-shadow: 0 0 0 1px #ff8a5c; animation: stuckpulse 3s ease-in-out infinite; }
  @keyframes stuckpulse { 50% { box-shadow: 0 0 0 1px rgba(255,138,92,.4), 0 0 14px rgba(255,138,92,.25); } }
  .planet.waiting { --c: var(--amber); box-shadow: 0 0 0 1px var(--amber), 0 0 22px rgba(255,181,71,.35); animation: needs 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  @keyframes needs { 50% { box-shadow: 0 0 0 1px var(--amber), 0 0 6px rgba(255,181,71,.15); } }
  #now { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 10px 18px 12px;
    background: linear-gradient(to top, rgba(4,7,11,.96) 60%, rgba(4,7,11,0)); font-size: 12px; }
  #now .k { color: var(--accent); letter-spacing: .3em; font-size: 9px; text-transform: uppercase; }
  #now .legend { color: var(--dim); font-size: 10px; white-space: nowrap; } #now .legend i { font-style: normal; margin-left: 8px; }
  #now .ls { color: #ff8a5c; } #now .lw { color: #4fd8ff; } #now .ld { color: #5ef2c2; } #now .ln { color: var(--amber); } #now .lt { color: #5ef2c2; }
  #now.needs .txt { color: var(--amber); } #now.turn .txt { color: #5ef2c2; } #now.working .txt { color: #9fe9ff; }
  #bell { padding: 3px 8px; letter-spacing: 0; font-size: 12px; } #bell.on { border-color: var(--accent); }
  @media (max-width: 1100px) { #now .legend { display: none; } }
  #now .txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #needs { display: none; border-color: var(--amber); color: var(--amber); }
  #needs.on { display: inline-block; animation: needs 1.6s ease-in-out infinite; }

  /* Phone: what needs you first (sessions list), then the terminal, the map and the activity feed,
     with a thumb-reach nav bar at the bottom */
  @media (max-width: 860px) {
    body { display: flex; flex-direction: column; overflow: auto; height: auto; font-size: 13px; padding-bottom: calc(58px + env(safe-area-inset-bottom)); }
    header { position: sticky; top: 0; z-index: 6; background: rgba(4,7,11,.96); gap: 12px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); flex-wrap: nowrap; }
    .brand span, header .stat, #tbtn, #ibtn, #viewbtn, #demo, #fit, #session { display: none; }
    #needs.on { margin-left: auto; padding: 8px 12px; }
    aside { display: contents; }
    #inbox { order: 1; max-height: none; border-bottom: 1px solid var(--line); padding: 14px 16px 8px; scroll-margin-top: 56px; }
    #terms { order: 2; height: 70vh; height: 70dvh; border-right: 0; border-bottom: 1px solid var(--line); scroll-margin-top: 56px; }
    #stage { order: 3; height: 60vh; height: 60dvh; flex: none; scroll-margin-top: 56px; }
    #feedwrap { order: 4; min-height: 50vh; scroll-margin-top: 56px; }
    #detail { order: 5; max-height: none; }

    #mnav { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: rgba(4,9,14,.97); border-top: 1px solid var(--line2); padding-bottom: env(safe-area-inset-bottom); }
    #mnav button { border: 0; border-radius: 0; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 9px; letter-spacing: .15em; color: var(--dim); position: relative; }

  /* Motion only where it carries meaning, and none at all if the system asks for less */

</style>
</head>

<script>
const $ = (id) => document.getElementById(id);

// ---------- palette: one cool family, amber = needs you, red = failed ----------
const ACCENT = "#4fd8ff"; window.ACCENT_BASE = ACCENT; const AMBER = "#ffb547", RED = "#ff5468", BG = "#04070b";
const ROLE_COLORS = { scout: "#4fd8ff", researcher: "#9db8ff", builder: "#5ef2c2", reviewer: "#c3a6ff", planner: "#ffd38a", generalist: "#8fe3ff" };
const PALETTE = ["#4fd8ff", "#9db8ff", "#5ef2c2", "#c3a6ff", "#8fe3ff", "#7fc8ff"];
const hash = (s) => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);

// ---------- plain English for what a session is doing ----------
const SESSION_TOOLS = { list_sessions: "Checking on sessions", read_session: "Reading a session's screen", send_to_session: "Sending instructions to a session",
  start_goal: "Giving a session a goal", open_session: "Opening a session", close_session: "Closing a session",
  list_terminals: "Checking on sessions", read_terminal: "Reading a session's screen", send_to_terminal: "Sending instructions to a session", open_terminal: "Opening a session" };
// Claude Code's own bookkeeping: not worth showing on the map
const PLUMBING = /^(ToolSearch|TodoWrite|TaskCreate|TaskUpdate|TaskList|TaskGet|TaskOutput|EnterPlanMode|ExitPlanMode|ListMcpResourcesTool|ReadMcpResourceTool)$/;
function toolName(tool) {
  const m = /^mcp__(.+?)__(.+)$/.exec(tool || "");
  if (!m) return tool;
  return SESSION_TOOLS[m[2]] || `${m[2].replace(/_/g, " ")} · ${m[1].replace(/^plugin_/, "").replace(/_/g, " ")}`;
}
function humanAction(tool, summary, skill) {
  if (skill) return `Using the ${skill} skill`;
  if (!tool || PLUMBING.test(tool)) return null;
  if (tool.startsWith("mcp__")) return toolName(tool);
  const s = summary ? String(summary) : "";
  switch (tool) {
    case "Bash": return s ? `Running: ${s}` : "Running a command";
    case "Read": return `Reading ${s || "a file"}`;
    case "Edit": case "Write": case "NotebookEdit": return `Editing ${s || "a file"}`;
    case "Grep": case "Glob": return s ? `Searching for ${s}` : "Searching";
    case "WebSearch": return `Searching the web: ${s}`;
    case "WebFetch": return `Reading a web page: ${s}`;
    case "Agent": case "Task": return `Starting a helper: ${s}`;
    case "Skill": return `Using the ${s} skill`;
  }
  return s ? `${tool}: ${s}` : tool;
}

// ---------- roster ----------
let roster = [];
const typeToRole = new Map();
function roleFor(subagentType) {
  const t = subagentType || "general-purpose";
  if (typeToRole.has(t)) return typeToRole.get(t);
  const bare = t.includes(":") ? t.split(":").pop() : t;
  return typeToRole.get(bare) || bare;
}
function roleMeta(role) {
  const r = roster.find((x) => x.role === role);
  const clean = (v) => (v && !/^[—–-]+$/.test(v) ? v : undefined);
  return { color: ROLE_COLORS[role] || PALETTE[hash(role) % PALETTE.length], model: clean(r?.model), use: clean(r?.use), type: clean(r?.subagent_type) };
}

// ---------- graph per session: nodes appear only when they are called ----------
const sessions = new Map();
let current = null, pinned = false, selectedId = "axa";
const COLLAPSE_MS = 7000; // a finished job folds its tool leaves away after this

function newGraph(id, cwd) {
  const g = { id, cwd, last: 0, calls: 0, events: [], nodes: new Map(), links: [], pending: [] };
  addNode(g, { id: "axa", kind: "axa", label: "AXA", color: ACCENT, x: 0, y: 0, fixed: true, status: "idle" });
  return g;
}
function addNode(g, n, parentId) {
  const p = parentId && g.nodes.get(parentId);
  const a = Math.random() * Math.PI * 2;
  n.x ??= (p ? p.x : 0) + Math.cos(a) * 30;
  n.y ??= (p ? p.y : 0) + Math.sin(a) * 30;
  Object.assign(n, { vx: 0, vy: 0, parent: parentId || null, hotUntil: 0, count: 0, born: performance.now() });
  g.nodes.set(n.id, n);
  if (p) g.links.push({ a: p.id, b: n.id });
  return n;
}
function removeNode(g, id) {
  for (const n of [...g.nodes.values()]) if (n.parent === id) removeNode(g, n.id);
  g.nodes.delete(id);
  g.links = g.links.filter((l) => l.a !== id && l.b !== id);
}
function ensureRole(g, role) {
  const id = "role:" + role;
  return g.nodes.get(id) || addNode(g, { id, kind: "role", label: role, role, color: roleMeta(role).color, status: "idle", calls: 0 }, "axa");
}
function ensureInst(g, e) {
  let n = g.nodes.get(e.agent_id);
  if (n) return n;
  const role = roleFor(e.agent_type);
  const r = ensureRole(g, role);
  const jobs = [...g.nodes.values()].filter((x) => x.parent === r.id && x.kind === "inst");
  if (jobs.length >= 5) removeNode(g, jobs.sort((a, b) => a.start - b.start)[0].id);
  return addNode(g, { id: e.agent_id, kind: "inst", label: role, role, color: r.color, status: "running", start: e.ts }, r.id);
}
function ensureLeaf(g, parent, name, kind) {
  const id = parent.id + "|" + name;
  let n = g.nodes.get(id);
  if (!n) {
    if ([...g.nodes.values()].filter((x) => x.parent === parent.id && x.kind === "leaf").length >= 9) return null;
    n = addNode(g, { id, kind: "leaf", label: name, leafKind: kind, color: parent.color, recent: [] }, parent.id);
  }
  return n;
}

function ingest(e) {
  if (!e || !e.session) return;
  let g = sessions.get(e.session);
  if (!g) { g = newGraph(e.session, e.cwd); sessions.set(e.session, g); }
  g.last = e.ts; g.cwd = e.cwd || g.cwd;
  if (e.role) g.role = e.role;
  if (e.terminal) g.terminal = e.terminal;
  if (e.event === "PreToolUse" && !e.agent_id) { const a = humanAction(e.tool, e.summary, e.skill); if (a) g.doing = a; }
  if (e.event === "UserPromptSubmit") g.doing = "Thinking";
  if (e.event === "Stop") g.doing = null;
  const axa = g.nodes.get("axa");
  const owner = e.agent_id ? ensureInst(g, e) : axa;
  const isSpawn = e.tool === "Agent" || e.tool === "Task";
  const now = performance.now();

  switch (e.event) {
    case "UserPromptSubmit":
      if (!/^\s*<task-notification>/.test(e.prompt || "")) { axa.prompt = e.prompt; g.turnStart = e.ts; }
      axa.status = "running"; axa.yourTurn = false; axa.perm = null; break;
    case "Stop": axa.status = "idle"; axa.message = e.message; axa.yourTurn = true; axa.perm = null; axa.doneAt = e.ts; break;
    // A permission request goes to AXA's approver first; it only needs you if AXA escalates it
    // (or the prompt is actually on screen)
    case "PermissionRequest": owner.reviewing = e.tool || true; break;
    case "AxaDecision": owner.reviewing = null; owner.perm = e.decision === "escalate" ? e.tool || true : null; break;
    case "Notification": if (/permission/i.test(e.notification_type || e.message || "")) owner.perm = owner.reviewing || owner.perm || true; break;
    case "PreToolUse": {
      g.calls++; owner.perm = null;
      if (isSpawn && !e.agent_id) {
        const role = roleFor(e.subagent_type);
        const r = ensureRole(g, role);
        r.calls++; r.hotUntil = now + 1600;
        g.pending.push({ role, prompt: e.prompt, desc: e.summary });
        break;
      }
      if (!e.skill && PLUMBING.test(e.tool || "")) break;
      const name = e.skill ? e.skill : toolName(e.tool);
      if (owner.kind === "inst") { owner.steps = (owner.steps || 0) + 1; owner.now = humanAction(e.tool, e.summary, e.skill); owner.fail = false; }
      const leaf = ensureLeaf(g, owner, name, e.skill ? "skill" : "tool");
      if (leaf) { leaf.count++; leaf.hotUntil = now + 1100; leaf.fail = false; leaf.recent.unshift(e.summary || ""); leaf.recent.length = Math.min(leaf.recent.length, 5); }
      break;
    }
    case "PostToolUse": owner.perm = null; break;
    case "PostToolUseFailure": {
      const leaf = g.nodes.get(owner.id + "|" + (e.skill || toolName(e.tool)));
      if (leaf) { leaf.fail = true; leaf.hotUntil = 0; leaf.error = e.error; }
      if (owner.kind === "inst") owner.fail = e.error || true;
      owner.perm = null;
      break;
    }
    case "SubagentStart": {
      const role = roleFor(e.agent_type);
      const i = g.pending.findIndex((p) => p.role === role);
      const spawn = i >= 0 ? g.pending.splice(i, 1)[0] : null;
      if (!spawn) ensureRole(g, role).calls++; // started without a visible dispatch (e.g. background agents)
      const n = ensureInst(g, e);
      n.status = "running"; n.start = e.ts;
      if (spawn) { n.prompt = spawn.prompt; n.desc = spawn.desc; n.label = spawn.desc || n.label; }
      break;
    }
    case "SubagentStop": {
      const n = g.nodes.get(e.agent_id);
      if (n) { n.status = "done"; n.message = e.message; n.end = e.ts; n.perm = null; }
      break;
    }
  }
  for (const r of g.nodes.values()) if (r.kind === "role")
    r.status = [...g.nodes.values()].some((x) => x.parent === r.id && x.status === "running") ? "running" : "idle";
  g.events.push(e);
  if (g.events.length > 3000) g.events.splice(0, g.events.length - 3000);
  dirty = true;
}

// collapsed = leaves of a job that finished a while ago (kept in data, hidden from the map)
const HELPER_KEEP_MS = 10000;
function hidden(g, n) {
  if (mission && n.kind !== "axa") {
    if (n.kind !== "inst") return true;
    return n.status === "done" && Date.now() - n.end > HELPER_KEEP_MS && selectedId !== n.id;
  }
  if (n.kind !== "leaf") return false;
  const p = g.nodes.get(n.parent);
  return p && p.kind === "inst" && p.status === "done" && Date.now() - p.end > COLLAPSE_MS && selectedId !== p.id;
}

// ---------- physics ----------
const W = { axa: 3.4, role: 2.2, inst: 1.4, leaf: 0.6 };
const LEN = { role: 210, inst: 110, leaf: 58 };
function step(g) {
  const ns = [...g.nodes.values()].filter((n) => !n.hide);
  for (let i = 0; i < ns.length; i++) for (let j = i + 1; j < ns.length; j++) {
    const a = ns[i], b = ns[j];
    let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
    if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
    if (d2 > 250000) continue;
    const f = 2600 * W[a.kind] * W[b.kind] / d2, d = Math.sqrt(d2);
    a.vx -= dx / d * f; a.vy -= dy / d * f; b.vx += dx / d * f; b.vy += dy / d * f;
  }
  for (const l of g.links) {
    const a = g.nodes.get(l.a), b = g.nodes.get(l.b);
    if (!a || !b || b.hide) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const f = (d - (LEN[b.kind] || 80)) * 0.035;
    a.vx += dx / d * f * 0.5; a.vy += dy / d * f * 0.5; b.vx -= dx / d * f; b.vy -= dy / d * f;
  }
  for (const n of ns) {
    if (n.fixed) { n.vx = n.vy = 0; continue; }
    n.vx -= n.x * 0.0015; n.vy -= n.y * 0.0015;
    n.vx *= 0.8; n.vy *= 0.8;
    const v = Math.hypot(n.vx, n.vy); if (v > 12) { n.vx *= 12 / v; n.vy *= 12 / v; }
    if (n !== drag?.node) { n.x += n.vx; n.y += n.vy; }
  }
}

// ---------- drawing ----------
const cv = $("cv"), ctx = cv.getContext("2d");
let Wd = 0, Ht = 0, dpr = 1;
const cam = { x: 0, y: 0, k: 1 }; let autoFit = true;
function resize() {
  const r = cv.getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
  Wd = r.width; Ht = r.height; cv.width = Wd * dpr; cv.height = Ht * dpr;
}
new ResizeObserver(resize).observe(cv);
const toWorld = (sx, sy) => [(sx - Wd / 2) / cam.k + cam.x, (sy - Ht / 2) / cam.k + cam.y];

function fit(g, instant) {
  if (mission) {
    const R = PLANET_R + 150, k = Math.min(1.2, Math.min(Wd / (2 * R + 40), (Ht - 50) / (2 * (PLANET_R + 90) + 40)));
    const t = instant ? 1 : 0.06;
    cam.x += (0 - cam.x) * t; cam.y += (10 - cam.y) * t; cam.k += (k - cam.k) * t;
    return;
  }
  let x0 = -160, y0 = -160, x1 = 160, y1 = 160; // keep AXA's rings in frame even when alone
  for (const n of g.nodes.values()) if (!n.hide) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); }
  const dockH = $("dock").classList.contains("on") ? $("dock").offsetHeight : 0;
  const k = Math.min(1.5, Math.min(Wd / (x1 - x0 + 260), (Ht - dockH) / (y1 - y0 + 220)));
  const t = instant ? 1 : 0.05;
  cam.x += ((x0 + x1) / 2 - cam.x) * t; cam.y += ((y0 + y1) / 2 + dockH / 2 / k - cam.y) * t; cam.k += (k - cam.k) * t;
}

function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
const trunc = (s, n) => (s && s.length > n ? s.slice(0, n - 1) + "…" : s || "");
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
function text(str, x, y, { size = 10, color = "#cfe9f3", weight = 400, spacing = 0, align = "center", alpha = 1 } = {}) {
  ctx.font = `${weight} ${size}px ui-monospace, "SF Mono", Menlo, monospace`;
  if ("letterSpacing" in ctx) ctx.letterSpacing = spacing + "px";
  ctx.textAlign = align; ctx.globalAlpha = alpha;
  ctx.lineJoin = "round"; ctx.lineWidth = 4; ctx.strokeStyle = BG; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  ctx.globalAlpha = 1; if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
}
function arc(x, y, r, a0, a1, color, w, alpha = 1) {
  ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = w;
  ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.stroke(); ctx.globalAlpha = 1;
}
// label "types in" over its first moments on screen
const typed = (s, n, now) => s.slice(0, Math.max(1, Math.floor((now - n.born) / 22)));
const active = (n, now) => n.status === "running" || n.hotUntil > now;

function drawBackdrop(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const grd = ctx.createRadialGradient(Wd / 2, Ht / 2, 0, Wd / 2, Ht / 2, Math.max(Wd, Ht) * 0.7);
  grd.addColorStop(0, "#081521"); grd.addColorStop(1, BG);
  ctx.fillStyle = grd; ctx.fillRect(0, 0, Wd, Ht);
  // HUD corner brackets
  ctx.strokeStyle = "rgba(79,216,255,.35)"; ctx.lineWidth = 1;
  const m = 14, L = 22;
  for (const [x, y, sx, sy] of [[m, m, 1, 1], [Wd - m, m, -1, 1], [m, Ht - m, 1, -1], [Wd - m, Ht - m, -1, -1]]) {
    ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke();
  }
  text(new Date().toLocaleTimeString([], { hour12: false }), Wd - 22, Ht - 22, { size: 9, color: "#3b5666", spacing: 2, align: "right" });
}

function drawRange(now) {
  // range rings + bearing ticks around AXA
  for (const r of [210, 330, 450]) {
    ctx.setLineDash([2, 8]); arc(0, 0, r, 0, Math.PI * 2, ACCENT, 1 / cam.k, 0.12); ctx.setLineDash([]);
  }
  ctx.strokeStyle = "rgba(79,216,255,.18)"; ctx.lineWidth = 1 / cam.k;
  for (let i = 0; i < 72; i++) {
    const a = (i / 72) * Math.PI * 2, r0 = 450, r1 = i % 6 ? 456 : 464;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.stroke();
  }
}

function drawAxa(n, now) {
  const t = now / 1000, on = n.status === "running", pulse = 0.5 + 0.5 * Math.sin(t * 3);
  const ACCENT = n.perm ? AMBER : n.yourTurn ? "#5ef2c2" : window.ACCENT_BASE;
  ctx.save(); ctx.translate(n.x, n.y);
  // core glow
  const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 60);
  glow.addColorStop(0, rgba(ACCENT, on ? 0.45 + pulse * 0.2 : 0.25)); glow.addColorStop(1, rgba(ACCENT, 0));
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, 60, 0, 7); ctx.fill();
  ctx.fillStyle = "#e9fbff"; ctx.shadowColor = ACCENT; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.arc(0, 0, 9 + (on ? pulse * 2 : 0), 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  arc(0, 0, 17, 0, 7, ACCENT, 1.5, 0.9);
  // segmented reactor ring
  for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI * 2 + t * 0.15; arc(0, 0, 26, a + 0.08, a + Math.PI / 5 - 0.08, ACCENT, 5, 0.55); }
  // rotating arcs
  const sp = on ? 1.1 : 0.35;
  for (let i = 0; i < 3; i++) { const a = t * sp + (i * Math.PI * 2) / 3; arc(0, 0, 38, a, a + 1.2, ACCENT, 1.5, 0.85); }
  for (let i = 0; i < 2; i++) { const a = -t * sp * 0.6 + i * Math.PI; arc(0, 0, 46, a, a + 2.2, ACCENT, 1, 0.45); }
  // tick ring
  ctx.strokeStyle = rgba(ACCENT, 0.35); ctx.lineWidth = 1;
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * Math.PI * 2 - t * 0.08, r1 = i % 5 ? 54 : 58;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * 52, Math.sin(a) * 52); ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.stroke();
  }
  ctx.restore();
  text("AXA", n.x, n.y + 78, { size: 13, weight: 500, color: ACCENT, spacing: 7 });
  const state = n.perm ? "⚠ NEEDS YOUR APPROVAL" : on ? "● WORKING" : n.yourTurn ? "◆ YOUR TURN" : "READY";
  text(state, n.x, n.y + 93, { size: 9, weight: 500, color: n.perm ? AMBER : on ? "#9fe9ff" : n.yourTurn ? "#5ef2c2" : "#5d7a89", spacing: 2.5 });
}

// A tag on a branch off AXA saying, in words, what state it's in: waiting on you, or what it's doing
function drawAxaCallout(n, g, now) {
  calloutBox = null;
  let label, c, urgent = false;
  if (n.perm) { label = "⚠ WAITING ON YOU · approve it in the AXA tab"; c = AMBER; urgent = true; }
  else if (n.status === "running") { label = "● " + trunc(g.doing || "Thinking", 52); c = window.ACCENT_BASE; }
  else if (n.yourTurn) { label = "◆ WAITING ON YOU · your turn to reply"; c = "#5ef2c2"; urgent = true; }
  else return;
  const pulse = urgent ? 0.5 + 0.5 * Math.sin(now / 260) : 1;
  // The tag sits where you put it (drag it; default up and to the right). The branch leaves the
  // ring toward it, then runs a short horizontal step into the tag's nearest side.
  const { dx, dy } = mapLayout.callout || { dx: 118, dy: -96 };
  const ax = n.x + dx, ay = n.y + dy, right = dx >= 0, side = right ? 1 : -1;
  const a = Math.atan2(dy, dx), x0 = n.x + Math.cos(a) * 62, y0 = n.y + Math.sin(a) * 62;
  ctx.strokeStyle = rgba(c, 0.75); ctx.lineWidth = 1.2 / Math.max(cam.k, 0.6);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(ax - side * 14, ay); ctx.lineTo(ax, ay); ctx.stroke();
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x0, y0, 2.5, 0, 7); ctx.fill();
  ctx.font = `500 11px ui-monospace, "SF Mono", Menlo, monospace`;
  const w = ctx.measureText(label).width + 20, h = 24, bx = right ? ax : ax - w, by = ay - h / 2;
  calloutBox = { x: bx, y: by, w, h, ax, ay };
  ctx.shadowColor = c; ctx.shadowBlur = urgent ? 6 + pulse * 12 : 4;
  ctx.fillStyle = "rgba(4,10,16,.94)"; ctx.fillRect(bx, by, w, h);
  ctx.strokeStyle = c; ctx.lineWidth = 1; ctx.strokeRect(bx, by, w, h); ctx.shadowBlur = 0;
  ctx.fillStyle = c; ctx.fillRect(bx, by, 3, h);
  text(label, bx + 12, by + 16, { size: 11, weight: 500, color: urgent ? c : "#e3f6fc", align: "left", alpha: urgent ? 0.75 + 0.25 * pulse : 1 });
}

function drawRole(g, n, now) {
  const t = now / 1000, on = n.status === "running", hot = n.hotUntil > now, c = n.color;
  const appear = ease((now - n.born) / 600), r = 15 * appear;
  const jobs = [...g.nodes.values()].filter((x) => x.parent === n.id && x.status === "running").length;
  if (on || hot) { const gl = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 40); gl.addColorStop(0, rgba(c, 0.28)); gl.addColorStop(1, rgba(c, 0)); ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(n.x, n.y, 40, 0, 7); ctx.fill(); }
  ctx.fillStyle = BG; ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 7); ctx.fill();
  arc(n.x, n.y, r, 0, 7, c, 1.5, on ? 1 : 0.6);
  ctx.fillStyle = c; ctx.globalAlpha = on ? 1 : 0.55; ctx.beginPath(); ctx.arc(n.x, n.y, 4, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  if (on) for (let i = 0; i < 2; i++) { const a = t * 1.6 + i * Math.PI; arc(n.x, n.y, r + 7, a, a + 1.4, c, 1.5, 0.9); }
  else arc(n.x, n.y, r + 7, 0, 7, c, 0.75, 0.18 * appear);
  const label = typed(n.role.toUpperCase(), n, now);
  text(label, n.x, n.y + 36, { size: 11, weight: 500, color: c, spacing: 3, alpha: on ? 1 : 0.75 });
  const m = roleMeta(n.role);
  text([m.model, jobs ? `${jobs} ACTIVE` : `${n.calls} CALL${n.calls === 1 ? "" : "S"}`].filter(Boolean).join("  ·  ").toUpperCase(), n.x, n.y + 50, { size: 8, color: "#4f6b7a", spacing: 2, alpha: appear });
}

function drawInst(n, now) {
  const on = n.status === "running", c = n.fail ? RED : n.color, appear = ease((now - n.born) / 500);
  const pulse = 0.5 + 0.5 * Math.sin(now / 250 + hash(n.id));
  if (on) { ctx.shadowColor = c; ctx.shadowBlur = 10 + pulse * 8; }
  ctx.fillStyle = on ? c : BG; ctx.beginPath(); ctx.arc(n.x, n.y, 6 * appear, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  arc(n.x, n.y, 6 * appear, 0, 7, c, 1.2, on ? 1 : 0.5);
  if (on) arc(n.x, n.y, 11, now / 300, now / 300 + 1.6, c, 1, 0.7);
  text(trunc(typed(n.label, n, now), 34), n.x, n.y - 15, { size: 10, color: on ? "#e3f6fc" : "#5d7a89" });
}

function drawLeaf(n, now) {
  const hot = n.hotUntil > now, c = n.fail ? RED : hot ? "#ffffff" : n.color, appear = ease((now - n.born) / 400);
  const s = Math.min(2.5 + Math.sqrt(n.count) * 1.1, 6) * appear;
  if (hot || n.fail) { ctx.shadowColor = n.fail ? RED : n.color; ctx.shadowBlur = 14; }
  ctx.fillStyle = c; ctx.globalAlpha = hot || n.fail ? 1 : 0.7;
  if (n.leafKind === "skill") { ctx.beginPath(); ctx.moveTo(n.x, n.y - s - 1.5); ctx.lineTo(n.x + s + 1.5, n.y); ctx.lineTo(n.x, n.y + s + 1.5); ctx.lineTo(n.x - s - 1.5, n.y); ctx.closePath(); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(n.x, n.y, s, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  if (cam.k > 0.7 || hot) {
    const lbl = (n.leafKind === "skill" ? "◆ " : "") + n.label + (n.count > 1 ? `  ${n.count}` : "");
    text(typed(lbl, n, now), n.x, n.y + s + 12, { size: 9, color: n.fail ? RED : hot ? "#ffffff" : n.leafKind === "skill" ? n.color : "#6c8796" });
  }
}

function draw(g, now) {
  drawBackdrop(now);
  if (!g) return;
  for (const n of g.nodes.values()) n.hide = hidden(g, n);
  ctx.save();
  ctx.translate(Wd / 2, Ht / 2); ctx.scale(cam.k, cam.k); ctx.translate(-cam.x, -cam.y);
  drawRange(now);

  // links: draw outward from the parent as the node appears, then carry data packets while active
  if (mission) drawPlanetLinks(now);
  if (mission) text("click to talk", 0, 108, { size: 8, color: "#3f5b6a", spacing: 2 });
  for (const l of g.links) {
    let a = g.nodes.get(l.a);
    const b = g.nodes.get(l.b);
    if (!a || !b || b.hide) continue;
    if (a.hide) a = g.nodes.get("axa");
    const grow = ease((now - b.born) / 500), on = active(b, now);
    const ex = a.x + (b.x - a.x) * grow, ey = a.y + (b.y - a.y) * grow;
    ctx.strokeStyle = rgba(b.fail ? RED : b.color, on ? 0.6 : b.kind === "leaf" ? 0.16 : 0.26);
    ctx.lineWidth = (on ? 1.4 : 1) / Math.max(cam.k, 0.6);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(ex, ey); ctx.stroke();
    if (on && b.kind !== "leaf" && grow >= 1) {
      const len = Math.hypot(b.x - a.x, b.y - a.y), ux = (b.x - a.x) / len, uy = (b.y - a.y) / len;
      ctx.strokeStyle = "#eaffff"; ctx.lineWidth = 2 / Math.max(cam.k, 0.6); ctx.shadowColor = b.color; ctx.shadowBlur = 8;
      for (let i = 0; i < 3; i++) {
        const p = ((now / 1000) * 0.7 + i / 3) % 1, px = a.x + (b.x - a.x) * p, py = a.y + (b.y - a.y) * p;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + ux * 9, py + uy * 9); ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }
  }

  const order = { leaf: 0, inst: 1, role: 2, axa: 3 };
  for (const n of [...g.nodes.values()].filter((n) => !n.hide).sort((a, b) => order[a.kind] - order[b.kind])) {
    if (n.kind === "axa") { drawAxa(n, now); drawAxaCallout(n, g, now); }
    else if (n.kind === "role") drawRole(g, n, now);
    else if (n.kind === "inst") drawInst(n, now);
    else drawLeaf(n, now);
    if (n.id === selectedId && n.kind !== "axa") {
      const r = n.kind === "role" ? 30 : n.kind === "inst" ? 14 : 9;
      ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 1 / cam.k;
      for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + Math.PI / 4; ctx.beginPath(); ctx.arc(n.x, n.y, r, a - 0.3, a + 0.3); ctx.stroke(); }
    }
    if (n.perm) {
      const by = n.y - (n.kind === "inst" ? 34 : n.kind === "role" ? 44 : 24);
      const pulse = 0.5 + 0.5 * Math.sin(now / 180);
      ctx.strokeStyle = AMBER; ctx.lineWidth = 1; ctx.shadowColor = AMBER; ctx.shadowBlur = 6 + pulse * 8;
      ctx.fillStyle = "rgba(40,26,4,.9)"; ctx.beginPath(); ctx.rect(n.x - 52, by - 9, 104, 16); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
      text("AWAITING APPROVAL", n.x, by + 3, { size: 8, weight: 500, color: AMBER, spacing: 1.5 });
    }
  }
  ctx.restore();
}

// ---------- interaction ----------
let drag = null;
function hit(g, sx, sy) {
  const [x, y] = toWorld(sx, sy);
  let best = null, bd = Infinity;
  for (const n of g.nodes.values()) {
    if (n.hide) continue;
    const r = (n.kind === "axa" ? 50 : n.kind === "role" ? 22 : n.kind === "inst" ? 10 : 7) + 6 / cam.k;
    const d = Math.hypot(n.x - x, n.y - y);
    if (d < r && d < bd) { best = n; bd = d; }
  }
  return best;
}
cv.addEventListener("pointerdown", (ev) => {
  const g = sessions.get(current) || (mission ? idle : null); if (!g) return;
  // AXA's status tag can be dragged anywhere around it
  if (mission && calloutBox) {
    const [wx, wy] = toWorld(ev.offsetX, ev.offsetY), b = calloutBox;
    if (wx >= b.x && wx <= b.x + b.w && wy >= b.y && wy <= b.y + b.h) {
      drag = { callout: true, grab: [wx - b.ax, wy - b.ay], sx: ev.offsetX, sy: ev.offsetY, moved: false };
      cv.setPointerCapture(ev.pointerId); cv.classList.add("drag");
      return;
    }
  }
  const n = hit(g, ev.offsetX, ev.offsetY);
  drag = { node: n && !n.fixed ? n : null, sx: ev.offsetX, sy: ev.offsetY, cx: cam.x, cy: cam.y, moved: false, clicked: n };
  cv.setPointerCapture(ev.pointerId); cv.classList.add("drag");
});
cv.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  const dx = ev.offsetX - drag.sx, dy = ev.offsetY - drag.sy;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  if (drag.callout) {
    const axa = (sessions.get(current) || idle).nodes.get("axa"), [wx, wy] = toWorld(ev.offsetX, ev.offsetY);
    mapLayout.callout = { dx: wx - drag.grab[0] - axa.x, dy: wy - drag.grab[1] - axa.y };
    return;
  }
  if (drag.node) { const [x, y] = toWorld(ev.offsetX, ev.offsetY); drag.node.x = x; drag.node.y = y; }
  else if (drag.moved) { autoFit = false; cam.x = drag.cx - dx / cam.k; cam.y = drag.cy - dy / cam.k; }
});
cv.addEventListener("pointerup", () => {
  if (drag?.callout) { if (drag.moved) saveMapLayout(); drag = null; cv.classList.remove("drag"); return; }
  if (drag && !drag.moved) { selectedId = drag.clicked ? drag.clicked.id : "axa"; dirty = true; }
  // In the mission view, clicking AXA opens the commander's terminal: that's where you talk to it
  if (drag && !drag.moved && mission && drag.clicked?.kind === "axa") {
    const cmd = [...tabs.values()].find((t) => t.info.mode === "axa" && t.info.alive);
    if (cmd) { setTermsOpen(true); activate(cmd.info.id); }
  }
  drag = null; cv.classList.remove("drag");
});
cv.addEventListener("wheel", (ev) => {
  ev.preventDefault(); autoFit = false;
  const [wx, wy] = toWorld(ev.offsetX, ev.offsetY);
  cam.k = Math.max(0.25, Math.min(3, cam.k * Math.exp(-ev.deltaY * 0.0015)));
  cam.x = wx - (ev.offsetX - Wd / 2) / cam.k; cam.y = wy - (ev.offsetY - Ht / 2) / cam.k;
}, { passive: false });
$("fit").onclick = () => { autoFit = true; };
$("fit").ondblclick = () => { mapLayout = { planets: {}, callout: null }; saveMapLayout(); autoFit = true; };

// ---------- side panel ----------
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dur = (ms) => ms < 60000 ? (ms / 1000).toFixed(1) + "s" : Math.floor(ms / 60000) + "m " + Math.round((ms % 60000) / 1000) + "s";
const short = (id) => String(id || "").replace(/^agent-/, "").slice(0, 6);
const kv = (rows) => `<div class="kv">${rows.filter(([, v]) => v).map(([k, v]) => `<span class="k">${k}</span><span>${v}</span>`).join("")}</div>`;

function renderDetail(g) {
  const box = $("detail");
  if (!g) return box.replaceChildren();
  const n = g.nodes.get(selectedId) || g.nodes.get("axa");
  const kids = [...g.nodes.values()].filter((x) => x.parent === n.id);
  const head = (txt) => `<p class="title">Selected</p><h2 style="color:${n.color}">${txt}</h2>`;
  let html = "";
  if (n.kind === "axa") {
    html = head("AXA") + kv([
      ["status", n.status === "running" ? "processing" : "standing by"],
      ["agents", kids.filter((k) => k.kind === "role").map((k) => `${esc(k.role)} ×${k.calls}`).join(" · ") || "none called yet"],
      ["own calls", kids.filter((k) => k.kind === "leaf").map((k) => `${esc(k.label)} ×${k.count}`).join(" · ")],
    ]) + (n.prompt ? `<span class="k">directive</span><pre>${esc(n.prompt)}</pre>` : "") + (n.message ? `<span class="k">last report</span><pre>${esc(n.message)}</pre>` : "");
  } else if (n.kind === "role") {
    const m = roleMeta(n.role);
    html = head(esc(n.role)) + kv([["agent", esc(m.type || n.role)], ["model", esc(m.model)], ["use for", esc(m.use)], ["called", String(n.calls)]]) +
      `<span class="k">jobs</span><ul>${kids.map((k) => `<li>${k.status === "running" ? `<span style="color:${n.color}">●</span>` : "<span class='k'>✓</span>"} ${esc(k.desc || short(k.id))}</li>`).join("")}</ul>`;
  } else if (n.kind === "inst") {
    html = head(esc(n.role)) + kv([
      ["task", esc(n.desc)], ["status", n.status === "running" ? "active" : "complete"],
      ["elapsed", dur((n.end || Date.now()) - (n.start || Date.now()))],
      ["calls", kids.map((k) => `${esc(k.label)} ×${k.count}`).join(" · ")],
    ]) + (n.prompt ? `<span class="k">assigned by axa</span><pre>${esc(n.prompt)}</pre>` : "") + (n.message ? `<span class="k">report</span><pre>${esc(n.message)}</pre>` : "");
  } else {
    html = head(esc(n.label)) + kv([["type", n.leafKind], ["calls", String(n.count)]]) +
      (n.error ? `<span class="k">last error</span><pre>${esc(n.error)}</pre>` : "") +
      `<span class="k">recent</span><ul>${n.recent.map((r) => `<li>${esc(r) || "—"}</li>`).join("")}</ul>`;
  }
  box.innerHTML = html;
}

function describe(e) {
  const isSpawn = e.tool === "Agent" || e.tool === "Task";
  switch (e.event) {
    case "UserPromptSubmit": return /^\s*<task-notification>/.test(e.prompt || "") ? ["", "background task finished"] : ["prompt", "directive: " + esc(e.prompt)];
    case "Stop": return ["", "done, waiting for you"];
    case "SessionStart": return ["", "session " + esc(e.source || "start")];
    case "SubagentStart": return ["", "online"];
    case "SubagentStop": return ["", "reported back"];
    case "PermissionRequest": return ["", `asked AXA to approve: ${esc(humanAction(e.tool, e.summary) || e.tool)}`];
    case "AxaDecision":
      return e.decision === "allow" ? ["", `AXA approved: ${esc(e.reason)}`]
        : e.decision === "deny" ? ["fail", `AXA declined: ${esc(e.reason)}`]
        : ["perm", `needs your approval (${esc(e.reason)}): ${esc(e.summary)}`];
    case "Notification": return /permission/i.test(e.notification_type || "") ? ["perm", "waiting for your approval"] : null;
    case "UserAnswer": return ["", `you answered: <b>${esc(e.answer)}</b>`];
    case "VerifyGate": return ["perm", `AXA verify gate: sent back to check its work (${esc(e.summary)})`];
    case "PostToolUseFailure": return ["fail", `${esc(toolName(e.tool))} failed: ${esc(e.error)}`];
    case "PreToolUse": {
      if (isSpawn) return ["call", `started a helper (<b>${esc(roleFor(e.subagent_type))}</b>): ${esc(e.summary)}`];
      const a = humanAction(e.tool, e.summary, e.skill);
      return a ? ["", esc(a)] : null;
    }
  }
  return null;
}
let feedFor = null, feedCount = 0;
function renderFeed(g) {
  const feed = $("feed");
  if (!g) { feed.replaceChildren(); feedFor = null; return; }
  if (feedFor !== g.id) { feed.replaceChildren(); feedFor = g.id; feedCount = 0; }
  const frag = document.createDocumentFragment();
  for (const e of g.events.slice(feedCount)) {
    const d = describe(e); if (!d) continue;
    const row = document.createElement("div");
    row.className = "row " + d[0];
    const who = e.agent_id ? roleFor(e.agent_type) : "axa";
    const color = e.agent_id ? roleMeta(who).color : ACCENT;
    row.innerHTML = `<span class="t">${new Date(e.ts).toLocaleTimeString([], { hour12: false })}</span><span class="who" style="color:${color}">${esc(who)}</span><span class="what">${d[1]}</span>`;
    row.title = row.textContent;
    if (e.agent_id) row.onclick = () => { selectedId = e.agent_id; dirty = true; };
    frag.prepend(row);
  }
  feedCount = g.events.length;
  feed.prepend(frag);
  while (feed.childElementCount > 800) feed.lastChild.remove();
}

// bottom dock: one card per job that is running or finished recently
const DOCK_KEEP_MS = 20000;
const cardEls = new Map();
function renderDock(g) {
  const dock = $("dock"), wrap = $("cards");
  // Mission view: helpers from this turn stay until your next message, so you can see what they found
  const keepDone = (n) => (mission ? n.end >= (g.turnStart || 0) : Date.now() - n.end < DOCK_KEEP_MS);
  const jobs = g ? [...g.nodes.values()].filter((n) => n.kind === "inst" && (n.status === "running" || keepDone(n))).sort((a, b) => (a.status === "running") - (b.status === "running") || (a.end || a.start) - (b.end || b.start)).reverse() : [];
  dock.classList.toggle("on", jobs.length > 0);
  const all = g ? [...g.nodes.values()].filter((n) => n.kind === "inst") : [];
  const done = all.filter((n) => n.status === "done").length;
  $("mbar").style.width = all.length ? (done / all.length) * 100 + "%" : "0";
  $("mtext").innerHTML = `<b>${done}</b> / ${all.length} jobs complete`;
  const keep = new Set(jobs.map((j) => j.id));
  for (const [id, el] of cardEls) if (!keep.has(id) || !wrap.contains(el)) { el.remove(); cardEls.delete(id); }
  for (const j of jobs) {
    let el = cardEls.get(j.id);
    if (!el) {
      el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `<div class="top"><span class="role"></span><span class="time"></span></div><div class="task"></div><div class="bar"><i></i></div><div class="now"><span></span><span class="st"></span></div>`;
      el.onclick = () => { selectedId = j.id; dirty = true; };
      wrap.appendChild(el); cardEls.set(j.id, el);
    }
    wrap.appendChild(el);
    const state = j.status === "done" ? "done" : j.perm ? "perm" : j.fail ? "fail" : "run";
    el.className = `card ${state}${!mission && j.status === "done" && Date.now() - j.end > DOCK_KEEP_MS / 2 ? " fading" : ""}`;
    el.style.setProperty("--c", j.color);
    el.querySelector(".role").textContent = j.role;
    el.querySelector(".time").textContent = dur((j.end || Date.now()) - j.start);
    el.querySelector(".task").textContent = j.desc || "working…";
    el.querySelector(".task").title = j.desc || "";
    el.querySelector(".now span").innerHTML = j.status === "done" ? (j.message ? esc(j.message.replace(/\s+/g, " ").slice(0, 140)) : `<b>${j.steps || 0}</b> steps`) : j.perm ? `needs ok: <b>${esc(j.perm === true ? "tool" : j.perm)}</b>` : `<b>${esc(j.now || "starting")}</b>`;
    el.querySelector(".st").textContent = { done: "✓ done", perm: "⚠ needs you", fail: "retrying", run: `● ${j.steps || 0} steps` }[state];
    el.title = j.status === "done" ? "Click to read its full report" : "";
  }
}

function renderChrome(g) {
  renderDock(g);
  $("empty").style.display = g || mission ? "none" : "grid";
  if (!g && !locked) $("empty").innerHTML = focusCwd ? `Standing by<br><br>No activity in ${esc(focusCwd.split("/").pop())} yet` : "Standing by<br><br>Start a Claude Code session with AXA enabled — or run the demo";

// ---------- terminals: real Claude Code sessions inside the dashboard ----------
const tabs = new Map(); // id -> { info, term, fit, ws, el, tab }
let activeTab = null;
const XT_THEME = { background: "#03060a", foreground: "#cfe9f3", cursor: "#4fd8ff", cursorAccent: "#03060a", selectionBackground: "rgba(79,216,255,.3)",
  black: "#0b1620", brightBlack: "#4f6b7a", blue: "#4fa8ff", brightBlue: "#8fc8ff", cyan: "#4fd8ff", brightCyan: "#9fe9ff",
  green: "#5ef2c2", brightGreen: "#8ff7d6", magenta: "#c3a6ff", brightMagenta: "#dcc8ff", red: "#ff5468", brightRed: "#ff8a98",
  white: "#cfe9f3", brightWhite: "#ffffff", yellow: "#ffd38a", brightYellow: "#ffe2ad" };

function setTermsOpen(open) {
  document.body.classList.toggle("with-terms", open);
  $("tbtn").classList.toggle("on", open);
  try { localStorage.setItem("axa.terms", open ? "1" : "0"); } catch {}
  if (open && activeTab) requestAnimationFrame(() => { const t = tabs.get(activeTab); fitTab(t); t?.term.focus(); });
  // the map follows the active terminal only while the terminal pane is open
  focusCwd = open && activeTab ? tabs.get(activeTab)?.info.cwd || null : null; pinned = false; autoFit = true; dirty = true;
}
$("tbtn").onclick = () => setTermsOpen(!document.body.classList.contains("with-terms"));
$("ibtn").onclick = () => { const off = document.body.classList.toggle("no-intel"); $("ibtn").classList.toggle("on", !off); try { localStorage.setItem("axa.intel", off ? "0" : "1"); } catch {} };

function termMsg(html) { $("termmsg").innerHTML = html; $("termmsg").style.display = html ? "grid" : "none"; }

function fitTab(t) {
  if (!t || !t.fit || !t.el.offsetWidth) return;
  try { t.fit.fit(); } catch {}
  if (t.ws?.readyState === 1) t.ws.send(JSON.stringify({ t: "r", c: t.term.cols, r: t.term.rows }));
}
new ResizeObserver(() => fitTab(tabs.get(activeTab))).observe($("termhost"));

function openTab(info) {
  if (tabs.has(info.id)) return tabs.get(info.id);
  const el = document.createElement("div"); el.className = "xt"; $("termhost").appendChild(el);
  const term = new Terminal({ fontFamily: 'ui-monospace, "SF Mono", Menlo, monospace', fontSize: 12.5, lineHeight: 1.15, cursorBlink: true, theme: XT_THEME, allowProposedApi: true, scrollback: 5000 });
  const fit = new FitAddon.FitAddon(); term.loadAddon(fit); term.open(el);
  const tab = document.createElement("div"); tab.className = "tab";
  tab.innerHTML = `<span class="dot"></span><span>${esc(info.name)}</span><span class="mode">${{ claude: "claude", axa: "commander", shell: "sh" }[info.mode] || "sh"}</span><span class="x" title="Close">✕</span>`;
  if (info.mode === "axa") { tab.classList.add("axa"); $("tablist").prepend(tab); }
  tab.onclick = (ev) => { if (ev.target.classList.contains("x")) closeTab(info.id); else activate(info.id); };
  if (info.mode !== "axa") $("tablist").appendChild(tab);
  const t = { info, term, fit, el, tab, ws: null };
  tabs.set(info.id, t);
  const connectWs = () => {
    const ws = new WebSocket(`ws://${location.host}/pty/${info.id}`);
    t.ws = ws;
    let replay = true;
    ws.onopen = () => { term.reset(); fitTab(t); };
    // The first message replays the session's recent output. Terminal queries inside it (tmux asks
    // "what terminal are you?") make xterm answer again, and those answers would be typed into the
    // session as junk like "1;2c0;276;0c": drop them while the replay is being drawn.
    ws.onmessage = (m) => {
      if (!replay) return term.write(m.data);
      replay = false; t.muted = true;
      term.write(m.data, () => { t.muted = false; });
    };
    ws.onclose = () => { if (tabs.has(info.id)) tab.classList.add("dead"); };
  };
  const REPLY = /^(?:\x1b\[[?>]?[\d;]*[cRn]|\x1b\][\d;]*rgb:[^\x07\x1b]*(?:\x07|\x1b\\)|\x1b\[[IO])+$/;
  term.onData((d) => { if (t.muted && REPLY.test(d)) return; if (t.ws?.readyState === 1) t.ws.send(JSON.stringify({ t: "i", d })); });
  connectWs();
  return t;
}

function activate(id) {
  activeTab = id;
  for (const [k, t] of tabs) { t.el.classList.toggle("active", k === id); t.tab.classList.toggle("active", k === id); }
  if (tabs.size) termMsg(""); else showEmpty();
  const t = tabs.get(id);
  if (t) {
    requestAnimationFrame(() => { fitTab(t); t.term.focus(); });
    // the map follows the project this terminal is in
    focusCwd = t.info.cwd; pinned = false; autoFit = true; dirty = true;
  }
  try { localStorage.setItem("axa.activeTab", id || ""); } catch {}
}

async function closeTab(id) {
  const t = tabs.get(id); if (!t) return;
  if (t.info.alive && !t.tab.classList.contains("dead") && !confirm(`Close ${t.info.name}? This ends its process.`)) return;
  await fetch(`/api/terms/${id}`, { method: "DELETE" });
  t.ws?.close(); t.term.dispose(); t.el.remove(); t.tab.remove(); tabs.delete(id);
  if (activeTab === id) { const next = [...tabs.keys()].pop(); if (next) activate(next); else { activeTab = null; focusCwd = null; showEmpty(); } }
}

async function launch(cwd, mode, extra = {}) {
  $("picker").hidden = true;
  const r = await fetch("/api/terms", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ cwd, mode, ...extra }) });
  const body = await r.json();
  if (!r.ok) return alert(body.error || "Could not start terminal");
  openTab(body); activate(body.id); setTermsOpen(true);
}

// project list with Claude / Shell launch buttons (used by the + popover and the empty pane)
async function renderProjects(el, onEscape) {
  const [r, rc] = await Promise.all([fetch("/api/projects"), fetch("/api/chats")]);
  const projects = r.ok ? await r.json() : [];
  const chats = rc.ok ? await rc.json() : [];
  const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`; };
  el.innerHTML = `<div class="proj axa-row"><div><b>AXA commander</b><small>one Claude session that sees and drives every terminal</small></div><button class="axa-go" data-m="axa">Launch</button><span></span></div>` +
    (chats.length ? `<p class="title" style="margin-top:12px">Continue a chat as AXA</p><small class="hint">Close it wherever else it's open first: a chat runs in one place at a time.</small>` +
      chats.map((c, i) => `<div class="proj"><div><b>${esc(c.title)}</b><small>${esc(c.cwd.replace(/^\/(Users|home)\/[^/]+/, "~"))} · ${ago(c.updated)}</small></div><button data-c="${i}">Continue</button><span></span></div>`).join("") : "") + `
    <p class="title" style="margin-top:12px">Launch in project</p>` + projects.map((p, i) => `
    <div class="proj"><div><b>${esc(p.name)}</b><small>${esc(p.path.replace(/^\/(Users|home)\/[^/]+/, "~"))}</small></div>
    <button data-i="${i}" data-m="claude">Claude</button><button data-i="${i}" data-m="shell">Shell</button></div>`).join("") +
    `<input class="custompath" placeholder="or type a path, e.g. ~/projects/n2s-platform/dashboard  ↵">`;
  el.querySelectorAll("button[data-i]").forEach((b) => (b.onclick = () => launch(projects[b.dataset.i].path, b.dataset.m)));
  el.querySelectorAll("button[data-c]").forEach((b) => (b.onclick = () => launch(null, "axa", { resume: chats[b.dataset.c].id })));
  el.querySelector(".axa-go").onclick = () => { const open = [...tabs.values()].find((t) => t.info.mode === "axa" && t.info.alive); if (open) { activate(open.info.id); $("picker").hidden = true; } else launch("~", "axa"); };
  el.querySelector(".custompath").onkeydown = (ev) => { if (ev.key === "Enter" && ev.target.value.trim()) launch(ev.target.value.trim(), "claude"); if (ev.key === "Escape") onEscape?.(); };
}
async function showPicker() {
  const pk = $("picker");
  if (!pk.hidden) { pk.hidden = true; return; }
  await renderProjects(pk, () => (pk.hidden = true));
  pk.hidden = false;
}
function showEmpty() {
  termMsg(`No terminal open<div class="list" id="emptylist"></div>`);
  renderProjects($("emptylist"));
}
$("newterm").onclick = showPicker;

// terminal along the bottom (default) or beside the map
function setLayout(mode) {
  const bottom = mode === "bottom";
  document.body.classList.toggle("term-bottom", bottom);
  $("layoutbtn").textContent = bottom ? "◫" : "⬓";
  $("layoutbtn").title = bottom ? "Put terminal beside the map" : "Put terminal along the bottom";
  try { localStorage.setItem("axa.layout", mode); } catch {}
  requestAnimationFrame(() => { const t = tabs.get(activeTab); fitTab(t); t?.term.focus(); });
}
$("layoutbtn").onclick = () => setLayout(document.body.classList.contains("term-bottom") ? "side" : "bottom");

// draggable divider between terminals and the map
$("splitter").addEventListener("pointerdown", (ev) => {
  const sp = $("splitter"); sp.classList.add("drag"); sp.setPointerCapture(ev.pointerId);
  const bottom = document.body.classList.contains("term-bottom");
  const move = (e) => bottom
    ? document.body.style.setProperty("--th", Math.max(160, Math.min(window.innerHeight - 220, window.innerHeight - e.clientY)) + "px")
    : document.body.style.setProperty("--tw", Math.max(320, Math.min(window.innerWidth - 420, e.clientX)) + "px");
  const up = () => {
    sp.classList.remove("drag"); sp.removeEventListener("pointermove", move); sp.removeEventListener("pointerup", up); fitTab(tabs.get(activeTab));
    try { localStorage.setItem(bottom ? "axa.th" : "axa.tw", document.body.style.getPropertyValue(bottom ? "--th" : "--tw")); } catch {}
  };
  sp.addEventListener("pointermove", move); sp.addEventListener("pointerup", up);
});

async function initTerms() {
  let prefs = {};
  try { prefs = { open: localStorage.getItem("axa.terms"), intel: localStorage.getItem("axa.intel"), tw: localStorage.getItem("axa.tw"), th: localStorage.getItem("axa.th"), layout: localStorage.getItem("axa.layout"), active: localStorage.getItem("axa.activeTab") }; } catch {}
  if (prefs.tw) document.body.style.setProperty("--tw", prefs.tw);
  if (prefs.th) document.body.style.setProperty("--th", prefs.th);
  setLayout(prefs.layout || "bottom");
  if (prefs.intel === "0") { document.body.classList.add("no-intel"); $("ibtn").classList.remove("on"); }
  if (typeof Terminal === "undefined") { $("tbtn").title = "Terminals need: npm install in the console folder"; termMsg("Terminals unavailable<br><br>Run npm install in the AXA console folder, then restart it"); return; }
  const r = await fetch("/api/terms");
  if (!r.ok) { termMsg(esc((await r.json().catch(() => ({}))).error || "Terminals unavailable")); return; }
  const list = await r.json();
  list.forEach(openTab);
  if (list.length) activate(list.some((t) => t.id === prefs.active) ? prefs.active : list[list.length - 1].id); else showEmpty();
  setTermsOpen(prefs.open === "1" || (prefs.open === null && list.length > 0));
}

let locked = false;
async function loadRoster() {
  try { const r = await fetch("/roster"); locked = r.status === 401; roster = locked ? [] : await r.json(); } catch { roster = []; }
  typeToRole.clear();
  for (const r of roster) { typeToRole.set(r.subagent_type, r.role); typeToRole.set(r.subagent_type.split(":").pop(), r.role); }
}
function connect() {
  const es = new EventSource("/events");
  es.addEventListener("history", (m) => { for (const k of [...sessions.keys()]) if (k !== "demo") sessions.delete(k); feedFor = null; JSON.parse(m.data).forEach(ingest); dirty = true; });
  es.onmessage = (m) => { try { ingest(JSON.parse(m.data)); } catch {} };
  es.onopen = () => { $("live").classList.add("on"); $("live").textContent = "online"; };
  es.onerror = () => { $("live").classList.remove("on"); $("live").textContent = "offline"; };
}
loadRoster().then(() => {
  if (locked) { $("empty").innerHTML = "Console locked<br><br>Open it with /axa:console — or the unlock link the server prints"; $("live").textContent = "locked"; requestAnimationFrame(frame); return; }
  setView(mission); initTerms().then(pollTerms); connect(); requestAnimationFrame(frame); if (new URLSearchParams(location.search).has("demo")) demo(); });
