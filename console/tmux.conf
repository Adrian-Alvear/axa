# tmux settings for AXA console sessions. Used only on AXA's private socket (tmux -L axa-<port>),
# so your own tmux setup is untouched. tmux is invisible here: no status bar and no prefix key, so
# everything you type goes to the program in the session.
set -g status off
set -g history-limit 50000
# Mouse wheel scrolls the session's history in the browser terminal (hold Shift to select text)
set -g mouse on
set -g window-size latest
set -s escape-time 0
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g prefix None
set -g prefix2 None
unbind-key -a -T prefix
set -g remain-on-exit off
set -g allow-rename off
set -g set-titles off
set -g focus-events on
# Keep the server up with no sessions: "no tmux server" then means the machine restarted
set -s exit-empty off
